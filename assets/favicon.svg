<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="tau over a decay curve">
  <!--
    tao / t½ / 荀
    - the glyph is tau: the name, and the decay time constant (t½ = tau * ln 2)
    - its stem is drawn as an exponential decay curve over an axis, with a
      dashed marker at the half-life: the concentration-time profile of pharmacokinetics
    - top right: 不, from Xunzi's 大巧在所不为 (see .agents.md)
    Palette is the site's own (_sass/terminal.scss).
  -->
  <rect width="64" height="64" rx="12" fill="#0c0c0c"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="10.75" fill="none" stroke="#3a3732" stroke-width="1.5"/>

  <g transform="translate(1.5,-1.5)">
    <!-- asymptote / time axis -->
    <path d="M13 50 H47" stroke="#3a3732" stroke-width="1.6" stroke-linecap="round"/>
    <!-- half-life -->
    <path d="M27.5 35 V49.2" stroke="#6b665e" stroke-width="1.7" stroke-dasharray="2.5 3" stroke-linecap="round"/>
    <!-- tau: crossbar, then a stem that decays -->
    <path d="M13 19 H41" stroke="#d4a054" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M25 20 C25 35 30 44.5 45 46.5" stroke="#d4a054" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 不, as a seal in the corner -->
  <g stroke="#6b665e" stroke-width="8" stroke-linecap="round" fill="none" transform="translate(45.5,9) scale(0.13)">
    <path d="M6 24 H94"/>
    <path d="M50 24 C48 48 36 70 10 92"/>
    <path d="M57 24 V96"/>
    <path d="M63 52 L90 88"/>
  </g>
</svg>
