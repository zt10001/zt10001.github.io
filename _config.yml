title: Tao Zheng
author: Tao Zheng
email: taozheng@umich.edu
url: https://zt10001.github.io
baseurl: ""
description: >
  Pharmaceutical Sciences researcher at the University of Michigan working
  on pharmaceutical research and development.

permalink: /:slug.html
favicon: /assets/favicon.svg

theme_config:
  shell_user: tao
  shell_host: zt10001
  back_home_text: "cd .."
  date_format: "%Y-%m-%d"
  show_description: false
  lowercase_titles: true

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
