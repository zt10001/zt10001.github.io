title: Tao Zheng
author: Tao Zheng
email: taozheng@umich.edu
url: https://zt10001.github.io
baseurl: ""
description: >
  Pharmaceutical Sciences researcher at the University of Michigan working
  on pharmaceutical research and development.

permalink: /:slug.html
favicon: profile.jpg

remote_theme: riggraz/no-style-please@2f8dba2c23633b21e45dce0fe2e34ec2d79bb1ca

theme_config:
  appearance: auto
  back_home_text: ".."
  date_format: "%Y-%m-%d"
  show_description: true
  lowercase_titles: false

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-seo-tag

jektex:
  silent: true

disable_disk_cache: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
